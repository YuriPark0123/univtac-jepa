# ACT-specific arguments
state_dim: 8
kl_weight: 10.0
chunk_size: 50
hidden_dim: 512
dim_feedforward: 3200

temporal_agg: true
device: cuda:0

# DETR parser args
ckpt_dir: null
policy_class: ACT
num_steps: 4000

# Model training params
batch_size: 64
save_freq: 1000
position_embedding: sine
lr_vision_backbone: 0.00001
weight_decay: 0.0001
lr: 0.00001
masks: false
dilation: false
backbone: resnet18
nheads: 8
enc_layers: 4
dec_layers: 7
pre_norm: false
dropout: 0.1
camera_names:
  - cam_high

# tactile args
tactile_names:
  - tac_left
  - tac_right
lr_tactile_backbone: 0.0
# tactile encoder (policy/tactile_encoders): original | resnet18_imagenet | sparsh_mae | sparsh_dino | sparsh_ijepa | sparsh_vjepa | custom_jepa
tactile_encoder: sparsh_mae
freeze_tactile_encoder: true
# background (no-contact) frame for Sparsh's background subtraction: first_frame | fixed
tactile_background: first_frame
# tactile_background_files: {tac_left: data/tactile_bg/left.npy, tac_right: data/tactile_bg/right.npy}  # for 'fixed'
